# Formato JSON personalizado para access logs con información de seguridad
log_format juice_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"x_forwarded_for":"$http_x_forwarded_for",'
  '"request":"$request",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time",'
  '"http_referrer":"$http_referer",'
  '"http_user_agent":"$http_user_agent",'
  '"http_x_real_ip":"$http_x_real_ip",'
  '"upstream_addr":"$upstream_addr",'
  '"host":"$host",'
  '"server_name":"$server_name"'
'}';

server {
  listen 80;
  server_name _;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
  add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

  location / {
    proxy_pass http://juice-shop:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Usar el formato JSON personalizado
    access_log /var/log/nginx/juice_access.log juice_json;
    error_log  /var/log/nginx/juice_error.log warn;
  }

  location /healthz {
    return 200 "ok\n";
  }
}